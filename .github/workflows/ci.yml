name: RaceDay CI

on:
  push:
    branches: [ main, part3 ]
  pull_request:
    branches: [ main ]

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore RaceDay.API.csproj
      - name: Build
        run: dotnet build RaceDay.API.csproj --configuration Release --no-restore

  build-web:
    name: Build MVC app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore RaceDay.Web/RaceDay.Web.csproj
      - name: Build
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --configuration Release --no-restore

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t raceday-web ./RaceDay.Web
